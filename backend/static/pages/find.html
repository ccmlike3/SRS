<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>근처 Bluetooth 장치 찾기</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      color: #333;
    }
    .container {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      transition: box-shadow 0.3s ease;
      width: 90%;
      max-width: 520px;
    }
    h1 {
      color: #007bff;
      margin-bottom: 20px;
    }
    p.desc {
      margin-top: 0;
      margin-bottom: 20px;
      color: #6c757d;
      font-size: 0.95em;
    }
    #status-message {
      margin-top: 15px;
      font-weight: bold;
      min-height: 1.4em;
    }
    #find-devices-btn {
      padding: 12px 25px;
      background: #17a2b8;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
      width: 100%;
      max-width: 260px;
      margin-top: 10px;
    }
    #find-devices-btn:hover {
      background: #138496;
    }
    .device-info {
      margin-top: 25px;
      padding: 15px;
      border-radius: 8px;
      background: #f8f9fa;
      text-align: left;
      font-size: 0.95em;
      display: none;
    }
    .device-info h3 {
      margin-top: 0;
      color: #007bff;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 5px;
      font-size: 1em;
    }
    .device-info p {
      margin: 5px 0;
      word-break: break-all;
    }
    .back-button {
      margin-top: 25px;
      padding: 12px 25px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
      width: 100%;
      max-width: 260px;
    }
    .back-button:hover {
      background: #0056b3;
    }
    .tip {
      margin-top: 15px;
      font-size: 0.8em;
      color: #999;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>🔎 근처 Bluetooth 장치 찾기</h1>
  <p class="desc">
    이 페이지는 <strong>Web Bluetooth API</strong>를 사용하여<br>
    주변의 Bluetooth 장치를 검색하는 데모입니다.<br>
    일부 브라우저/환경에서는 동작하지 않을 수 있습니다.
  </p>

  <button id="find-devices-btn">🔍 Bluetooth 장치 검색 시작</button>
  <div id="status-message"></div>

  <div id="device-info-container" class="device-info">
    <h3>📱 선택한 장치 정보</h3>
    <p><strong>이름:</strong> <span id="device-name"></span></p>
    <p><strong>ID:</strong> <span id="device-id"></span></p>
  </div>

  <button class="back-button" onclick="window.location.href='/frontend'">
    🏠 메인 페이지로 돌아가기
  </button>

  <div class="tip">
    ⚠ Web Bluetooth는 일반적으로 HTTPS 또는 localhost 환경에서만 동작합니다.
  </div>
</div>

<script>
  const findButton = document.getElementById('find-devices-btn');
  const statusMessage = document.getElementById('status-message');
  const deviceInfoContainer = document.getElementById('device-info-container');
  const deviceNameSpan = document.getElementById('device-name');
  const deviceIdSpan = document.getElementById('device-id');

  async function onFindClick() {
    try {
      if (!navigator.bluetooth) {
        statusMessage.textContent = '❌ 이 브라우저는 Web Bluetooth를 지원하지 않습니다.';
        statusMessage.style.color = '#dc3545';
        return;
      }

      statusMessage.textContent = '🔄 장치 검색 중...';
      statusMessage.style.color = '#333';
      deviceInfoContainer.style.display = 'none';
      findButton.disabled = true;

      const device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true
      });

      statusMessage.textContent = '✅ 장치를 선택했습니다.';
      statusMessage.style.color = '#28a745';

      deviceNameSpan.textContent = device.name || '이름 없음';
      deviceIdSpan.textContent = device.id;
      deviceInfoContainer.style.display = 'block';

      console.log('선택된 장치:', device);
    } catch (error) {
      console.error('Web Bluetooth API 오류:', error);

      if (error.name === 'NotFoundError') {
        statusMessage.textContent = '⛔ 장치 선택을 취소했습니다.';
      } else {
        statusMessage.textContent = '❌ 오류 발생: ' + error.message;
      }
      statusMessage.style.color = '#dc3545';
      deviceInfoContainer.style.display = 'none';
    } finally {
      findButton.disabled = false;
    }
  }

  findButton.addEventListener('click', onFindClick);
</script>
</body>
</html>
